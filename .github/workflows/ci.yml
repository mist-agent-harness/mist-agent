name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # 报告模式：闭环建成前红灯是常态，只看板不拦门。
      # 六绿之后把这行换成 acceptance:strict，红灯开始拦 merge。
      - run: npm run acceptance
